<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="manifest.json">
    <title>دردشة نصية عشوائية - Random Text Chat</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #333;
        }

        .container {
            width: 90%;
            max-width: 800px;
            height: 90vh;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .start-section {
            padding: 40px;
            text-align: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 20px 20px 0 0;
        }

        .start-section h1 {
            margin-bottom: 20px;
            font-size: 24px;
        }

        .start-section p {
            margin-bottom: 30px;
            opacity: 0.9;
        }

        .btn-start {
            padding: 15px 40px;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            background: #4CAF50;
            color: white;
        }

        .btn-start:hover {
            background: #45a049;
            transform: scale(1.05);
        }

        .chat-section {
            flex: 1;
            background: #f5f5f5;
            display: flex;
            flex-direction: column;
            display: none;
        }

        .chat-header {
            background: #667eea;
            color: white;
            padding: 20px;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-info {
            flex: 1;
        }

        .settings-btn {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }

        .settings-btn:hover {
            background: rgba(255, 255, 255, 0.4);
        }

        .stats {
            font-size: 12px;
            opacity: 0.9;
            margin-top: 5px;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .message {
            padding: 10px 12px;
            border-radius: 10px;
            word-wrap: break-word;
            max-width: 100%;
            font-size: 13px;
            line-height: 1.4;
        }

        .message.own {
            background: #667eea;
            color: white;
            align-self: flex-end;
            text-align: right;
            max-width: 90%;
        }

        .message.other {
            background: #e0e0e0;
            color: #333;
            align-self: flex-start;
            max-width: 90%;
        }

        .chat-input-area {
            padding: 15px;
            border-top: 1px solid #ddd;
            display: flex;
            gap: 8px;
        }

        .chat-input-area input {
            flex: 1;
            padding: 10px 15px;
            border: 1px solid #ddd;
            border-radius: 20px;
            font-size: 13px;
            outline: none;
        }

        .chat-input-area input:focus {
            border-color: #667eea;
            box-shadow: 0 0 5px rgba(102, 126, 234, 0.3);
        }

        .chat-input-area button {
            padding: 8px 20px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-size: 12px;
        }

        .chat-input-area button:hover {
            background: #5568d3;
        }

        .status {
            background: #fff3cd;
            padding: 10px;
            text-align: center;
            font-size: 13px;
            border-bottom: 1px solid #ddd;
        }

        .status.connected {
            background: #d4edda;
            color: #155724;
        }

        .status.disconnected {
            background: #f8d7da;
            color: #721c24;
        }

        .loading {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: currentColor;
            margin-left: 5px;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
        }

        .modal.show {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background-color: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            max-width: 400px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
        }

        .close-modal {
            float: left;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
            color: #aaa;
        }

        .close-modal:hover {
            color: #000;
        }

        .setting-group {
            margin: 20px 0;
            padding: 15px;
            background: #f5f5f5;
            border-radius: 10px;
        }

        .setting-group label {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            margin: 10px 0;
        }

        .setting-group input[type="checkbox"] {
            cursor: pointer;
        }

        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #4CAF50;
            color: white;
            padding: 15px 20px;
            border-radius: 8px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            animation: slideIn 0.3s ease;
            max-width: 300px;
            z-index: 100;
        }

        @keyframes slideIn {
            from {
                transform: translateX(400px);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        .message-counter {
            background: #f44336;
            color: white;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            position: absolute;
            top: -10px;
            right: -10px;
        }

        body.dark-mode {
            background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
        }

        body.dark-mode .container {
            background: #1e1e1e;
        }

        body.dark-mode .chat-section {
            background: #252525;
        }

        body.dark-mode .chat-messages {
            background: #1e1e1e;
        }

        body.dark-mode .message.other {
            background: #333;
            color: #fff;
        }

        body.dark-mode .chat-input-area {
            border-top-color: #444;
        }

        body.dark-mode .chat-input-area input {
            background: #333;
            color: #fff;
            border-color: #444;
        }

        @media (max-width: 768px) {
            .container {
                height: 100vh;
            }

            .chat-messages {
                max-height: 400px;
                overflow-y: auto;
            }

            .chat-input-area {
                padding: 10px;
            }

            .chat-input-area input {
                font-size: 14px;
                padding: 8px 12px;
            }

            .chat-input-area button {
                padding: 8px 16px;
                font-size: 12px;
            }

            .chat-header {
                padding: 15px;
                font-size: 16px;
            }

            .stats {
                font-size: 11px;
            }

            .modal-content {
                width: 95%;
                max-height: 90vh;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="start-section" id="startSection">
            <h1>دردشة نصية عشوائية</h1>
            <p>تواصل مع أشخاص من جميع أنحاء العالم بشكل مجهول</p>
            <button class="btn-start" id="startBtn">ابدأ الدردشة</button>
        </div>

        <div class="chat-section" id="chatSection">
            <div class="chat-header">
                <div class="header-info">
                    <div>💬 الرسائل (Messages)</div>
                    <div class="stats">
                        <span id="onlineCount">0</span> متصل |
                        <span id="messageCountBadge">0</span> رسائل
                    </div>
                </div>
                <button class="settings-btn" id="darkModeBtn">🌙</button>
            </div>
            <div class="status disconnected" id="status">
                غير متصل
                <span class="loading"></span>
            </div>
            <div class="chat-messages" id="chatMessages"></div>
            <div class="chat-input-area">
                <input
                    type="text"
                    id="messageInput"
                    placeholder="اكتب رسالة..."
                    disabled
                >
                <button id="sendBtn" disabled>إرسال</button>
            </div>
        </div>

        <!-- Settings Modal -->
        <div class="modal" id="settingsModal">
            <div class="modal-content">
                <span class="close-modal" id="closeSettings">&times;</span>
                <h2>⚙️ الإعدادات</h2>

                <div class="setting-group">
                    <label>
                        <input type="checkbox" id="soundToggle" checked>
                        تأثيرات صوتية
                    </label>
                    <label>
                        <input type="checkbox" id="notificationToggle" checked>
                        إشعارات
                    </label>
                    <label>
                        <input type="checkbox" id="vibrationToggle" checked>
                        اهتزاز
                    </label>
                </div>

                <div class="setting-group">
                    <button style="width: 100%; padding: 10px; background: #f44336; color: white; border: none; border-radius: 5px; cursor: pointer;">
                        مسح السجل التاريخي
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        // DOM Elements
        const startSection = document.getElementById('startSection');
        const chatSection = document.getElementById('chatSection');
        const startBtn = document.getElementById('startBtn');
        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');
        const chatMessages = document.getElementById('chatMessages');
        const status = document.getElementById('status');
        const onlineCount = document.getElementById('onlineCount');
        const messageCountBadge = document.getElementById('messageCountBadge');
        const settingsBtn = document.getElementById('settingsBtn');
        const settingsModal = document.getElementById('settingsModal');
        const closeSettings = document.getElementById('closeSettings');
        const darkModeBtn = document.getElementById('darkModeBtn');

        // Socket.io connection
        const socket = io();

        // State
        let partnerId = null;
        let isConnected = false;
        let messageCount = 0;
        let soundEnabled = true;
        let vibrationEnabled = true;

        // Start Chat
        startBtn.addEventListener('click', () => {
            startSection.style.display = 'none';
            chatSection.style.display = 'flex';
            updateStatus('جاري البحث عن شخص...', 'disconnected');
            addMessage('النظام: جاري البحث عن شخص للدردشة معه...', 'system');

            // Notify server user is ready to join random chat
            socket.emit('join');
        });

        // Socket.io Events
        socket.on('waiting', (data) => {
            updateStatus('في انتظار شخص آخر...', 'disconnected');
            addMessage('النظام: ' + data.message, 'system');
        });

        socket.on('connected', (data) => {
            updateStatus('متصل بالخادم، اضغط ابدأ للبحث عن شريك...', 'disconnected');
            addMessage('النظام: ' + (data.message || 'يمكنك البدء الآن.'), 'system');
        });

        socket.on('user-connected', (data) => {
            console.log('User connected:', data.partnerId);
            partnerId = data.partnerId;
            isConnected = true;
            updateStatus('متصل بشخص ما ✓', 'connected');
            addMessage('النظام: متصل بمستخدم عشوائي!', 'system');
            messageInput.disabled = false;
            sendBtn.disabled = false;
            messageCount = 0;
            messageCountBadge.textContent = '0';

            if (vibrationEnabled && 'vibrate' in navigator) {
                navigator.vibrate([100, 50, 100]);
            }
        });

        socket.on('message', (data) => {
            console.log('received message event:', data);
            addMessage(data.text, 'other');
        });

        socket.on('user-disconnected', (data) => {
            console.log('User disconnected:', data.message);
            partnerId = null;
            isConnected = false;
            messageInput.disabled = true;
            sendBtn.disabled = true;
            updateStatus('انقطع الاتصال. جاري البحث عن شريك جديد...', 'disconnected');
            addMessage('النظام: ' + (data.message || 'الشريك انقطع.'), 'system');
        });

        // Settings Modal
        settingsBtn.addEventListener('click', () => {
            settingsModal.classList.add('show');
        });

        closeSettings.addEventListener('click', () => {
            settingsModal.classList.remove('show');
        });

        settingsModal.addEventListener('click', (e) => {
            if (e.target === settingsModal) {
                settingsModal.classList.remove('show');
            }
        });

        // Sound Toggle
        document.getElementById('soundToggle').addEventListener('change', (e) => {
            soundEnabled = e.target.checked;
        });

        // Vibration Toggle
        document.getElementById('vibrationToggle').addEventListener('change', (e) => {
            vibrationEnabled = e.target.checked;
        });

        // Dark Mode
        darkModeBtn.addEventListener('click', () => {
            document.body.classList.toggle('dark-mode');
            darkModeBtn.textContent = document.body.classList.contains('dark-mode') ? '☀️' : '🌙';
            localStorage.setItem('darkMode', document.body.classList.contains('dark-mode'));
        });

        // Load dark mode preference
        if (localStorage.getItem('darkMode') === 'true') {
            document.body.classList.add('dark-mode');
            darkModeBtn.textContent = '☀️';
        }

        // Update online count
        socket.on('stats-update', (data) => {
            onlineCount.textContent = data.onlineUsers || 0;
        });

        // Send Message
        sendBtn.addEventListener('click', sendMessage);
        messageInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });

        function sendMessage() {
            const message = messageInput.value.trim();
            if (message === '') return;

            if (!partnerId) {
                showNotification('لا يوجد شريك دردشة متصل، الرجاء الانتظار.');
                return;
            }

            console.log('sending message', { message, partnerId });
            addMessage(message, 'own');
            messageInput.value = '';

            socket.emit('message', { text: message });
        }

        function addMessage(text, sender) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${sender}`;
            messageDiv.textContent = text;
            chatMessages.appendChild(messageDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;

            if (sender === 'other') {
                messageCount++;
                messageCountBadge.textContent = messageCount;
                playSound('camera');
            }
        }

        function updateStatus(text, className) {
            status.textContent = text;
            status.className = `status ${className}`;
        }

        // Sound effects
        function playSound(type) {
            if (!soundEnabled) return;

            const audioContext = new (window.AudioContext || window.webkitAudioContext)();
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();

            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);

            switch (type) {
                case 'camera':
                    oscillator.frequency.value = 1000;
                    gainNode.gain.setValueAtTime(0.1, audioContext.currentTime);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.05);
                    oscillator.start(audioContext.currentTime);
                    oscillator.stop(audioContext.currentTime + 0.05);
                    break;
            }
        }

        // Notifications
        function showNotification(message) {
            const notification = document.createElement('div');
            notification.className = 'notification';
            notification.textContent = message;
            document.body.appendChild(notification);

            if (vibrationEnabled && 'vibrate' in navigator) {
                navigator.vibrate(50);
            }

            setTimeout(() => {
                notification.remove();
            }, 3000);
        }

        // Initialize
        addMessage('اضغط "ابدأ الدردشة" للبدء - Click "Start Chat" to begin', 'system');
    </script>
    <script>
        // Register service worker for PWA
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js')
                    .then(registration => {
                        console.log('Service Worker registered:', registration);
                    })
                    .catch(error => {
                        console.log('Service Worker registration failed:', error);
                    });
            });
        }
    </script>
</body>
</html>
